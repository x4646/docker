<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Indexer 管理</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/file-browser.css">
<link rel="stylesheet" href="css/dir-tree.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">🖼 Photo Indexer</div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-status"    onclick="switchTab('status')">📊 状态</button>
    <button class="nav-tab"        id="tab-dirs"      onclick="switchTab('dirs')">📁 目录</button>
    <button class="nav-tab"        id="tab-playlists" onclick="switchTab('playlists')">🎵 播放列表</button>
    <button class="nav-tab"        id="tab-settings"  onclick="switchTab('settings')">⚙️ 设置</button>
    <button class="nav-tab"        id="tab-pc"        onclick="switchTab('pc')">💻 PC目录</button>
  </div>
</nav>

<div class="main">

  <!-- 状态页 -->
  <div id="page-status">
    <div class="card">
      <div class="card-title">
        📊 处理状态
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" id="btn-dispatch" onclick="toggleDispatch()">▶ 开始派发</button>
          <button class="btn-sm" onclick="loadStats()">🔄 刷新</button>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">待处理</div>
          <div class="stat-value pending" id="stat-pending">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">处理中</div>
          <div class="stat-value processing" id="stat-processing">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">已完成</div>
          <div class="stat-value done" id="stat-done">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">失败</div>
          <div class="stat-value error" id="stat-error">0</div>
        </div>
      </div>
      <div class="progress-wrap" style="margin-top:16px">
        <div class="progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
      <div style="font-size:.75rem;color:#507090;margin-top:6px" id="progress-text">0%</div>
    </div>
  </div>

  <!-- PC处理状态 -->
  <div id="pc-process-status" style="margin-top:12px;display:none">
    <div class="card">
      <div class="card-title">💻 PC处理进度 <button class="btn-sm" onclick="loadPcProcessStatus()">🔄 刷新</button></div>
      <div id="pc-process-detail" style="color:#507090;padding:12px">等待PC处理...</div>
    </div>
  </div>

  <!-- 目录页 -->
  <div id="page-dirs" style="display:none">
    <div class="card">
      <div class="card-title">
        📁 监控目录
        <button class="btn btn-primary" onclick="openAddDirBrowser()">＋ 添加目录</button>
      </div>
      <div class="dir-list" id="dir-list"></div>
    </div>
  </div>

  <!-- 播放列表页 -->
  <div id="page-playlists" style="display:none">
    <div class="card">
      <div class="card-title">
        🎵 播放列表
        <button class="btn btn-primary" onclick="openAddPlaylistModal()">＋ 新建列表</button>
      </div>
      <div class="playlist-list" id="playlist-list"></div>
    </div>
  </div>

  <!-- PC目录页 -->
  <div id="page-pc" style="display:none">
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">📊 PC处理状态 <button class="btn-sm" onclick="loadPcStats()">🔄 刷新</button></div>
      <div id="pc-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 0">
        <div class="stat-box"><div class="stat-label">总计</div><div class="stat-num" id="pc-stat-total">-</div></div>
        <div class="stat-box"><div class="stat-label">已完成</div><div class="stat-num" id="pc-stat-done" style="color:#3ddc84">-</div></div>
        <div class="stat-box"><div class="stat-label">待处理</div><div class="stat-num" id="pc-stat-pending" style="color:#ffa500">-</div></div>
        <div class="stat-box"><div class="stat-label">失败</div><div class="stat-num" id="pc-stat-error" style="color:#ff5567">-</div></div>
      </div>
    </div>
    <div class="card">
      <div id="pc-root-list"></div>
    </div>
  </div>

  <!-- 设置页 -->
  <div id="page-settings" style="display:none">
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">🌐 系统配置</div>
      <div class="form-group">
        <label class="form-label">NAS IP地址</label>
        <input class="form-input" id="cfg-nas-ip" placeholder="192.168.0.3">
      </div>
      <div class="form-group">
        <label class="form-label">NAS SMB主机名</label>
        <input class="form-input" id="cfg-smb-host" placeholder="whfnas">
      </div>
      <div class="form-group">
        <label class="form-label">nas-pipe端口</label>
        <input class="form-input" id="cfg-pipe-port" placeholder="3030">
      </div>
      <div class="form-group">
        <label class="form-label">photo-indexer端口</label>
        <input class="form-input" id="cfg-indexer-port" placeholder="3050">
      </div>
      <div class="form-group">
        <label class="form-label">photo-viewer端口</label>
        <input class="form-input" id="cfg-viewer-port" placeholder="3051">
      </div>
      <div class="form-group">
        <label class="form-label">nas-sync端口</label>
        <input class="form-input" id="cfg-sync-port" placeholder="3040">
      </div>
      <button class="btn btn-primary" onclick="saveSysConfig()">保存配置</button>
    </div>
	<div class="card">
      <div class="card-title">⚙️ 文件浏览器根目录</div>
      <div id="browser-roots-list"></div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-primary" onclick="openAddRootBrowser()">＋ 添加NAS根目录</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-title">🎵 音乐设置</div>
      <div class="form-group">
        <label class="form-label">播放模式</label>
        <select class="form-input" id="music-mode">
          <option value="shuffle">🔀 随机</option>
          <option value="order">▶ 顺序</option>
          <option value="repeat">🔁 单曲循环</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">音量</label>
        <input type="range" min="0" max="1" step="0.05" id="music-volume" style="width:200px;accent-color:#40d0ff">
        <span id="music-volume-val" style="font-size:.8rem;color:#507090;margin-left:8px">60%</span>
      </div>
      <div class="form-group">
        <label class="form-label">
          <input type="checkbox" id="music-autoplay" style="margin-right:6px">
          进入看图模式自动播放
        </label>
      </div>
      <button class="btn btn-primary" onclick="saveMusicSettings()">保存</button>
    </div>
  </div>

</div>

<!-- 新建播放列表 Modal -->
<div class="modal-overlay" id="pl-modal">
  <div class="modal">
    <div class="modal-title">新建播放列表</div>
    <div class="form-group">
      <label class="form-label">列表名称</label>
      <input class="form-input" id="pl-name" placeholder="例：看图BGM">
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="confirmAddPlaylist()">创建</button>
      <button class="btn-cancel"  onclick="closePlModal()">取消</button>
    </div>
  </div>
</div>

<!-- 编辑播放列表 Modal -->
<div class="modal-overlay" id="edit-pl-modal">
  <div class="modal" style="max-width:700px">
    <div class="modal-title" id="edit-pl-title">编辑播放列表</div>
    <div style="margin-bottom:10px;display:flex;gap:8px">
      <button class="btn btn-primary" onclick="openAddSongBrowser()">＋ 添加音乐</button>
      <button class="btn-sm" onclick="closeEditPlModal()">关闭</button>
    </div>
    <div class="song-list" id="song-list"></div>
  </div>
</div>

<script src="js/file-browser.js"></script>
<script src="js/dir-tree.js"></script>
<script src="js/dir-tree-widget.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
