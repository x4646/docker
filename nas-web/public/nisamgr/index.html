<link rel="manifest" href="manifest.json">
<script>(function(){
  // theme-color原来是写死的深色, 切到"明亮"主题后iOS状态栏/切换器卡片背景还是深色,
  // 跟页面实际颜色对不上。这里跟着data-theme(明亮/黑暗/跟随系统)同步。
  var LIGHT = "#EDEAE3", DARK = "#14181F";
  function resolve() {
    var t = document.documentElement.dataset.theme;
    if (t === "light") return LIGHT;
    if (t === "dark") return DARK;
    try { return window.matchMedia("(prefers-color-scheme: light)").matches ? LIGHT : DARK; } catch (e) { return DARK; }
  }
  function sync() {
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", resolve());
  }
  sync();
  try {
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", sync);
  } catch (e) {}
})();</script>
</head>
