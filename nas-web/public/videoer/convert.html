<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频转换队列</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    background: #0f1620; color: #f0f6ff;
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .sub { color: #8aa8c8; font-size: .82rem; margin-bottom: 20px; }
  a.back { color: #40d0ff; text-decoration: none; font-size: .82rem; }
  a.back:hover { text-decoration: underline; }

  .agent-bar {
    display: flex; align-items: center; gap: 10px;
    background: #161d28; border: 1px solid #2a3d55; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 18px; font-size: .82rem;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.on { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .dot.off { background: #ff5567; }
  .agent-bar .note { color: #607a99; margin-left: auto; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  button {
    background: #1e2838; color: #c8dff5; border: 1px solid #2a3d55;
    border-radius: 6px; padding: 7px 14px; font-size: .8rem; cursor: pointer;
  }
  button:hover { background: #2a3d55; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.danger:hover { background: #4a2230; border-color: #ff5567; color: #ff8899; }

  .empty {
    text-align: center; padding: 60px 20px; color: #506080;
    border: 1px dashed #2a3d55; border-radius: 12px; font-size: .85rem;
  }

  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th { text-align: left; color: #607a99; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #2a3d55; }
  td { padding: 10px; border-bottom: 1px solid #1c2836; vertical-align: middle; }
  tr:hover td { background: #141c28; }
  .fname { color: #f0f6ff; word-break: break-all; }
  .fpath { color: #4a6485; font-size: .72rem; word-break: break-all; margin-top: 2px; }
  .mode-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .7rem;
    border: 1px solid;
  }
  .mode-remux { color: #40d0ff; border-color: #40d0ff; background: rgba(64,208,255,.1); }
  .mode-transcode { color: #ffa500; border-color: #ffa500; background: rgba(255,165,0,.1); }

  .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; }
  .status-queued { color: #8aa8c8; }
  .status-processing { color: #40d0ff; }
  .status-processing .spin {
    width: 9px; height: 9px; border-radius: 50%; border: 2px solid #40d0ff;
    border-top-color: transparent; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-done { color: #2ecc71; }
  .status-failed { color: #ff5567; }
  .err-text { color: #ff8899; font-size: .72rem; margin-top: 3px; word-break: break-all; }

  .row-actions button { padding: 4px 10px; font-size: .74rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 视频转换队列</h1>
  <div class="sub"><a class="back" href="/videoer/">← 返回视频列表</a> ・ 在视频缩略图右键"转换成可播放格式"加入这里</div>

  <div class="agent-bar">
    <span class="dot" id="agent-dot"></span>
    <span id="agent-text">检查中…</span>
    <span class="note">每 3 秒自动刷新</span>
  </div>

  <div class="toolbar">
    <button id="btn-clear" class="danger">清除已完成/失败记录</button>
  </div>

  <div id="content"></div>
</div>

<script>
var POLL_MS = 3000;

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function basename(p) {
  var parts = String(p || '').split(/[\\/]/);
  return parts[parts.length - 1] || p;
}

function statusLabel(s) {
  if (s === 'queued') return { cls: 'status-queued', icon: '⏳', text: '排队中' };
  if (s === 'processing') return { cls: 'status-processing', icon: '<span class="spin"></span>', text: '处理中' };
  if (s === 'done') return { cls: 'status-done', icon: '✅', text: '已完成' };
  if (s === 'failed') return { cls: 'status-failed', icon: '❌', text: '失败' };
  return { cls: '', icon: '', text: s };
}

function render(data) {
  var dot = document.getElementById('agent-dot');
  var text = document.getElementById('agent-text');
  if (data.agentAlive) {
    dot.className = 'dot on';
    text.textContent = 'PC 端处理程序在线' + (data.running ? '，正在工作' : '，待命中');
  } else {
    dot.className = 'dot off';
    text.textContent = 'PC 端处理程序未连接（VconvAgent.ps1 没在跑，或者最近 15 分钟没心跳）';
  }

  var content = document.getElementById('content');
  if (!data.items.length) {
    content.innerHTML = '<div class="empty">队列是空的，去视频列表右键选一个视频"转换成可播放格式"试试</div>';
    return;
  }

  var rows = data.items.map(function (it) {
    var st = statusLabel(it.status);
    var modeCls = it.mode === 'transcode' ? 'mode-transcode' : 'mode-remux';
    var modeText = it.mode === 'transcode' ? '转码' : '换壳';
    var actions = '';
    if (it.status === 'queued') {
      actions = '<button onclick="cancelItem(\'' + it.md5 + '\')">撤销</button>';
    } else if (it.status === 'failed') {
      actions = '<button onclick="retryItem(\'' + it.md5 + '\')">重试</button>';
    }
    return '<tr>' +
      '<td><div class="fname">' + escHtml(basename(it.path)) + '</div><div class="fpath">' + escHtml(it.path) + '</div>' +
        (it.error ? '<div class="err-text">' + escHtml(it.error) + '</div>' : '') +
      '</td>' +
      '<td><span class="mode-badge ' + modeCls + '">' + modeText + '</span></td>' +
      '<td><span class="status-badge ' + st.cls + '">' + st.icon + ' ' + st.text + '</span></td>' +
      '<td class="row-actions">' + actions + '</td>' +
    '</tr>';
  }).join('');

  content.innerHTML = '<table><thead><tr><th>文件</th><th>方式</th><th>状态</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
}

async function refresh() {
  try {
    var r = await fetch('/api/vconv/queue');
    var data = await r.json();
    render(data);
  } catch (e) {
    document.getElementById('agent-text').textContent = '加载失败: ' + e.message;
  }
}

async function cancelItem(md5) {
  await fetch('/api/vconv/cancel', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ md5: md5 }),
  });
  refresh();
}

async function retryItem(md5) {
  await fetch('/api/vconv/priority', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ md5: md5 }),
  });
  refresh();
}

document.getElementById('btn-clear').onclick = async function () {
  await fetch('/api/vconv/clear-finished', { method: 'POST' });
  refresh();
};

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
