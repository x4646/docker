<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频省空间 / 缩略图 运行手册</title>
<style>
  :root { --bg:#0a0a0a; --surface:#141414; --border:#2a2a2a; --text:#e8e8e8; --text2:#909090; --accent:#40d0ff; --ok:#3ddc84; }
  body { margin:0 auto; max-width:1000px; padding:20px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; line-height:1.7; font-size:.92rem; }
  h1 { font-size:1.35rem; } h2 { font-size:1.1rem; border-bottom:1px solid var(--border); padding-bottom:4px; margin-top:28px; color:var(--accent); }
  code { background:#1c1c1c; border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:.82rem; color:var(--ok); }
  pre { background:#101418; border:1px solid var(--border); border-radius:8px; padding:12px; overflow-x:auto; }
  pre code { border:none; background:none; padding:0; color:#cfe8ff; }
  table { border-collapse:collapse; width:100%; font-size:.82rem; margin:10px 0; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--border); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:var(--surface); color:var(--text2); }
  a { color:var(--accent); } .back { font-size:.8rem; }
</style>
</head>
<body>
<div class="back"><a href="/nasmgr/">← 返回 NAS 管理</a></div>
<div id="md">加载中…</div>
<script>
(function () {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  function render(md) {
    const lines = md.split('\n'); const out = [];
    let i = 0, inList = false;
    const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };
    while (i < lines.length) {
      const l = lines[i];
      if (l.startsWith('```')) {
        closeList(); const buf = []; i++;
        while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]);
        i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
      }
      if (l.startsWith('|')) {
        closeList(); const rows = [];
        while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]);
        const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        const head = cells(rows[0]); const body = rows.slice(2).map(cells);
        out.push('<table><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr>' +
          body.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</table>');
        continue;
      }
      const h = l.match(/^(#{1,3}) (.*)/);
      if (h) { closeList(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
      const li = l.match(/^(?:- |\d+\. )(.*)/);
      if (li) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + inline(li[1]) + '</li>'); i++; continue; }
      closeList();
      if (l.trim()) out.push('<p>' + inline(l) + '</p>');
      i++;
    }
    closeList();
    return out.join('\n');
  }
  fetch('runbook.md?_=' + Date.now()).then((r) => r.text()).then((t) => { document.getElementById('md').innerHTML = render(t); })
    .catch((e) => { document.getElementById('md').textContent = '加载失败: ' + e.message; });
})();
</script>
</body>
</html>
