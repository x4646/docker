<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAS 文件同步</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">📁 NAS 文件同步</div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-status" onclick="switchTab('status')">📊 状态</button>
    <button class="nav-tab" id="tab-dirs"   onclick="switchTab('dirs')">📂 目录</button>
    <button class="nav-tab" id="tab-filter" onclick="switchTab('filter')">🔍 过滤</button>
    <button class="nav-tab" id="tab-log"    onclick="switchTab('log')">📋 日志</button>
  </div>
</nav>

<div class="main">

  <!-- 状态页 -->
  <div id="page-status">
    <div class="card">
      <div class="card-title">📊 同步状态</div>
      <div class="status-bar">
        <div class="stat-item">
          <div class="stat-label">电脑状态</div>
          <div class="stat-value offline" id="pc-status">🔴 离线</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">待同步</div>
          <div class="stat-value" id="pending-count">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">上次同步</div>
          <div class="stat-value" id="last-sync" style="font-size:.85rem">从未同步</div>
        </div>
      </div>
      <div class="action-bar">
        <button class="btn btn-primary" onclick="syncAll()">▶️ 全部同步</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        最新变更
        <button class="btn-sm" onclick="switchTab('log')">查看全部</button>
      </div>
      <div class="log-list" id="log-list-status">
        <div class="log-empty">暂无变更记录</div>
      </div>
    </div>
  </div>

  <!-- 目录页 -->
  <div id="page-dirs" style="display:none">
    <div class="card">
      <div class="card-title">
        📂 同步目录
        <button class="btn btn-primary" onclick="openAddDirModal()">＋ 添加目录</button>
      </div>
      <div class="dir-list" id="dir-list"></div>
    </div>
  </div>

  <!-- 过滤页 -->
  <div id="page-filter" style="display:none">
    <div class="card">
      <div class="card-title">🔍 排除扩展名</div>
      <div class="tag-list" id="ext-tags"></div>
      <div class="tag-add">
        <input class="tag-input" id="ext-input" placeholder=".tmp" onkeydown="if(event.key==='Enter')addTag('ext-tags','ext-input')">
        <button class="btn-sm" onclick="addTag('ext-tags','ext-input')">添加</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">🗂 排除文件夹</div>
      <div class="tag-list" id="dir-tags"></div>
      <div class="tag-add">
        <input class="tag-input" id="dir-input" placeholder="node_modules" onkeydown="if(event.key==='Enter')addTag('dir-tags','dir-input')">
        <button class="btn-sm" onclick="addTag('dir-tags','dir-input')">添加</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">✳️ 通配符规则</div>
      <div class="tag-list" id="glob-tags"></div>
      <div class="tag-add">
        <input class="tag-input" id="glob-input" placeholder="~$*" onkeydown="if(event.key==='Enter')addTag('glob-tags','glob-input')">
        <button class="btn-sm" onclick="addTag('glob-tags','glob-input')">添加</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📏 文件大小限制</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">最小文件大小（MB）</label>
          <input class="form-input" id="min-size" type="number" min="0" value="0">
        </div>
        <div class="form-group">
          <label class="form-label">最大文件大小（MB）</label>
          <input class="form-input" id="max-size" type="number" min="0" value="500">
        </div>
      </div>
    </div>
    <div class="action-bar">
      <button class="btn btn-primary" onclick="saveFilters()">💾 保存过滤规则</button>
    </div>
  </div>

  <!-- 日志页 -->
  <div id="page-log" style="display:none">
    <div class="card">
      <div class="card-title">
        📋 变更日志
        <button class="btn-sm danger" onclick="clearLogs()">清空</button>
      </div>
      <div class="log-toolbar">
        <button class="log-filter active" onclick="setLogFilter('all',this)">全部</button>
        <button class="log-filter" onclick="setLogFilter('create',this)">➕ 新增</button>
        <button class="log-filter" onclick="setLogFilter('modify',this)">✏️ 修改</button>
        <button class="log-filter" onclick="setLogFilter('move',this)">🔀 移动</button>
        <button class="log-filter" onclick="setLogFilter('delete',this)">🗑️ 删除</button>
        <input class="log-search" id="log-search" placeholder="搜索文件名..." oninput="loadLogs()">
      </div>
      <div class="log-list" id="log-list"></div>
    </div>
  </div>

</div>

<!-- 操作Modal -->
<div class="modal-overlay" id="action-modal">
  <div class="modal" style="max-width:360px">
    <div class="modal-title" id="action-modal-title">操作</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
      <button class="btn btn-primary" onclick="actionSyncDir()">▶️ 立即同步</button>
      <button class="btn" style="background:#1e2838;color:#c8dff5;border:1px solid #2a3d55" onclick="actionShowDiff()">🔍 查看差异</button>
      <button class="btn" style="background:#1e2838;color:#c8dff5;border:1px solid #2a3d55" onclick="actionEditDir()">✏️ 编辑配置</button>
      <button class="btn" style="background:transparent;color:#ff5567;border:1px solid #ff5567" onclick="actionDeleteDir()">❌ 删除</button>
    </div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" onclick="closeActionModal()">取消</button>
    </div>
  </div>
</div>

<!-- 添加/编辑目录 Modal -->
<div class="modal-overlay" id="dir-modal">
  <div class="modal">
    <div class="modal-title" id="dir-modal-title">添加同步目录</div>
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">NAS路径</label>
      <input class="form-input" id="dir-nas" placeholder="/share/BAK/Gcloud">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">电脑路径</label>
      <input class="form-input" id="dir-pc" placeholder="D:\cloud">
    </div>
    <div class="form-group">
      <label class="form-label">同步模式</label>
      <select class="form-input" id="dir-mode">
        <option value="mirror">🔄 单向镜像（NAS→电脑）</option>
        <option value="bidirectional">↔️ 双向同步</option>
        <option value="addonly">➕ 仅新增</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveDir()">保存</button>
      <button class="btn-cancel"  onclick="closeDirModal()">取消</button>
    </div>
  </div>
</div>

<!-- 同步进度Modal -->
<div class="modal-overlay" id="sync-modal">
  <div class="modal">
    <div class="modal-title" id="sync-modal-title">同步中...</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="sync-progress" style="width:0%"></div>
    </div>
    <div id="sync-result" style="font-size:.85rem;color:#90b8d8;margin-top:8px"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" onclick="closeSyncModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 差异Modal -->
<div class="modal-overlay" id="diff-modal">
  <div class="modal" style="max-width:600px">
    <div class="modal-title" id="diff-modal-title">查看差异</div>
    <div id="diff-content"></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="syncFromDiff()">▶️ 全部同步</button>
      <button class="btn-cancel"  onclick="closeDiffModal()">关闭</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
