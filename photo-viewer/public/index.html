<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">🖼 Photo</div>
  <input class="nav-search" placeholder="搜索图片、标签、描述..." oninput="onSearch(this.value)">
  <div id="active-tags" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div class="nav-actions">
    <button class="nav-btn" onclick="setFavoriteFilter(this)">❤️ 收藏</button>
    <button class="nav-btn" id="btn-music-toggle" onclick="toggleMusicBar()">🎵 音乐</button>
  </div>
</nav>

<div class="sidebar">
  <div class="sidebar-section">视图</div>
  <div class="sidebar-item active" onclick="setFilter('all')">📷 全部</div>
  <div class="sidebar-item" onclick="setFilter('favorite')">❤️ 收藏</div>
  <div class="sidebar-section" style="margin-top:8px">标签</div>
  <div class="tag-cloud" id="tag-cloud"></div>
</div>

<div class="main">
  <div class="stats-bar">
    共 <span id="stats-total">0</span> 张照片
  </div>
  <div class="content">
    <div class="photo-grid" id="photo-grid"></div>
    <div class="load-more">
      <div class="load-spinner" id="spinner" style="display:none"></div>
    </div>
    <div id="sentinel" style="height:1px"></div>
  </div>
</div>

<div class="viewer-overlay" id="viewer">
  <div class="viewer-header">
    <div class="viewer-title" id="viewer-filename"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="viewer-counter" style="font-size:.78rem;color:#909090"></span>
      <button class="viewer-btn slideshow-btn" id="btn-slideshow" onclick="toggleSlideshow()">▶ 幻灯片</button>
      <button class="viewer-btn" onclick="resetViewerTransform()">⊡</button>
      <button class="viewer-btn" onclick="toggleFavCurrent()">🤍</button>
      <button class="viewer-btn" onclick="closeViewer()">✕</button>
    </div>
  </div>

  <div class="viewer-body">
    <div class="viewer-img-wrap" id="viewer-img-wrap">
      <img class="viewer-img" id="viewer-img" src="" alt="">
    </div>
    <button class="viewer-prev" id="btn-prev" onclick="viewerPrev()">&#8249;</button>
    <button class="viewer-next" id="btn-next" onclick="viewerNext()">&#8250;</button>
    <div class="zoom-indicator" id="zoom-indicator">100%</div>
  </div>

  <div class="viewer-footer">
    <div class="viewer-info">
      <div class="info-item"><span class="info-label">尺寸：</span><span class="info-value" id="viewer-dims"></span></div>
      <div class="info-item"><span class="info-label">大小：</span><span class="info-value" id="viewer-size"></span></div>
      <div class="info-item"><span class="info-label">相机：</span><span class="info-value" id="viewer-camera"></span></div>
      <div class="info-item"><span class="info-label">时间：</span><span class="info-value" id="viewer-date"></span></div>
      <div class="info-item" style="flex:1"><span class="info-label">AI：</span><span class="info-value" id="viewer-ai" style="color:#909090"></span></div>
    </div>
    <div class="viewer-tags" id="viewer-tags"></div>
    <div class="music-bar" id="music-bar-viewer" style="display:none">
      <div class="music-info">
        <div class="music-name" id="music-name">未选择音乐</div>
      </div>
      <div class="music-controls">
        <button class="music-btn" onclick="prevSong()">&#9198;</button>
        <button class="music-btn play" id="btn-play" onclick="togglePlay()">&#9654;</button>
        <button class="music-btn" onclick="nextSong()">&#9197;</button>
        <button class="music-btn" onclick="toggleMode()" id="btn-mode">&#128256;</button>
      </div>
      <div class="music-progress" onclick="seekMusic(event)">
        <div class="music-progress-fill" id="music-progress-fill" style="width:0%"></div>
      </div>
      <div class="music-vol">
        <span style="font-size:.8rem">&#128266;</span>
        <input class="music-vol-slider" type="range" min="0" max="1" step="0.05" value="0.6" oninput="setVolume(this.value)">
      </div>
      <button class="music-list-btn" onclick="togglePlaylistPanel()">列表</button>
    </div>
  </div>
</div>

<div class="playlist-panel" id="playlist-panel">
  <div class="playlist-header">
    <div class="playlist-title">播放列表</div>
    <button style="background:none;border:none;color:#909090;cursor:pointer;font-size:1.2rem" onclick="togglePlaylistPanel()">&#10005;</button>
  </div>
  <div class="playlist-body" id="playlist-body"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
<!-- 主页面音乐播放栏 -->
<div id="main-music-bar" style="display:none;position:fixed;bottom:0;left:200px;right:0;z-index:50;background:rgba(10,10,10,.95);border-top:1px solid #2a3d55;height:52px;align-items:center;gap:12px;padding:0 16px;">
  <div style="flex:1;min-width:0">
    <div class="music-name" id="main-music-name" style="font-size:.8rem;color:#f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">未选择音乐</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="music-btn" onclick="prevSong()">⏮</button>
    <button class="music-btn play" id="main-btn-play" onclick="togglePlay()" style="width:36px;height:36px;background:#40d0ff;color:#000;border-radius:50%;border:none;cursor:pointer;font-size:1rem">▶</button>
    <button class="music-btn" onclick="nextSong()">⏭</button>
  </div>
  <div class="music-progress" onclick="seekMusic(event)" style="flex:1;max-width:200px;height:3px;background:#2a3d55;border-radius:3px;cursor:pointer">
    <div id="main-music-progress-fill" style="height:100%;background:#40d0ff;border-radius:3px;width:0%"></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <span style="font-size:.8rem">🔊</span>
    <input type="range" min="0" max="1" step="0.05" value="0.6" oninput="setVolume(this.value)" style="width:60px;accent-color:#40d0ff">
  </div>
  <button class="music-list-btn" onclick="togglePlaylistPanel()" style="padding:4px 10px;border-radius:4px;background:transparent;border:1px solid #2a3d55;color:#909090;font-size:.72rem;cursor:pointer">列表</button>
</div>
